# CVEvolve config generated by `xrd-app cvevolve-init`.
# {{ROOT}} was expanded to this project's CVEvolve/ directory at creation time;
# {{NAME}} to the session name. Edit freely — the metric description_hint and the
# prompt.md are the two places to tune "what the model is looking for".
name: {{NAME}}
num_workers_generate: 2
num_workers_tune: 2
model:
  model_name: claudeopus46
  api_key_env_var: ARGO_API_KEY
  api_base: https://apps.inside.anl.gov/argoapi/v1
  max_retries: 15
  rate_limit_resend_attempts: 30
  rate_limit_sleep_seconds: 60
workspace:
  root_dir: {{ROOT}}/sessions
  data_dir: {{ROOT}}/test_data
  holdout_data_dir: {{ROOT}}/holdout_data
  require_dangerous_command_approval: true
metric:
  name_hint: f2 score (recall-weighted)
  direction_hint: maximize
  target_value: null
  description_hint: >-
    PRIMARY METRIC: mean per-bin F2 score (recall-weighted, beta=2) for Bragg
    peak detection at the selected bin size. Detect peaks independently in each
    detector image and restrict candidates to the known 2-theta reflection
    bands. The evaluation harness defines the coordinate convention, matching
    radius, and empty-bin behavior. Maximize mean F2 across evaluation bins;
    precision, recall, and F1 are supporting metrics. Ground truth may omit weak
    real peaks, so favor recall without producing an excessive number of
    proposals. Tune thresholds and feature-size parameters from the supplied
    development data rather than assuming values from another bin size.
branching:
  warmup_rounds: 3
  tune_every: 3
  evolve_every: 2
  min_scored_for_tune: 1
  min_scored_for_evolve: 2
  lineage_selection_temperature: 1
stopping:
  max_rounds: 25
  patience_rounds: 12
  min_improvement: 0.0
# Hutch tracking — CVEvolve's own lightweight daemon + SQLite DB. Toggled from
# the "Enable Hutch tracking" checkbox in the Use CVEvolve dialog, which also
# drives the live [SQL table] [model output] view. db_path lives under the
# gitignored hutch/ dir.
hutch:
  enabled: false
  project: cvevolve
  run_id: null
  daemon_url: null
  db_path: '{{ROOT}}/hutch/{{NAME}}.db'
  strict: false
