# CVEvolve config generated by `xrd-app cvevolve-init`.
# {{ROOT}} was expanded to this project's CVEvolve/ directory at creation time;
# {{NAME}} to the session name. Edit freely — the metric description_hint and the
# prompt.md are the two places to tune "what the model is looking for".
name: {{NAME}}
num_workers_generate: 2
num_workers_tune: 2
model:
  model_name: claudeopus46
  api_key_env_var: ARGO_API_KEY
  api_base: https://apps.inside.anl.gov/argoapi/v1
  max_retries: 15
  rate_limit_resend_attempts: 30
  rate_limit_sleep_seconds: 60
workspace:
  root_dir: {{ROOT}}/sessions
  data_dir: {{ROOT}}/test_data
  holdout_data_dir: {{ROOT}}/holdout_data
  require_dangerous_command_approval: true
metric:
  name_hint: f2 score (recall-weighted)
  direction_hint: maximize
  target_value: null
  description_hint: >-
    PRIMARY METRIC: mean per-center-bin F2 score (recall-weighted, beta=2)
    for spatially-validated Bragg peak detection. Ground truth is derived
    from 3x3 annotations mapped to the center 1x1 frame, so it UNDERCOUNTS
    the peaks visible at full 1x1 sensitivity. The PRIMARY GOAL is therefore
    to RECALL all known 3x3 features; extra 1x1 detections are often real and
    must be only lightly penalized, so recall is weighted ~4x precision (F2).
    The algorithm must detect peaks in single-exposure frames, favoring recall
    within the known 2-theta bands. A detected point within 40 pixels of a
    ground truth point is a match. Maximize mean F2 across evaluation bins
    (precision/F1 reported for context only). Sensitivity can always be raised
    later; do not sacrifice recall of the 3x3 features to chase precision.
    (Optionally link detections across neighboring frames as a light spatial-
    persistence confirmation - real peaks recur in clusters, noise is isolated.)
branching:
  warmup_rounds: 3
  tune_every: 3
  evolve_every: 2
  min_scored_for_tune: 1
  min_scored_for_evolve: 2
  lineage_selection_temperature: 1
stopping:
  max_rounds: 25
  patience_rounds: 12
  min_improvement: 0.0
# MLflow tracking — standard experiment tracker. Point mlflow_tracking_uri at a
# server (e.g. http://164.54.100.181:5000/) to log to the shared beamline server
# instead of the local file store.
tracking:
  enabled: false
  mlflow_tracking_uri: 'file://{{ROOT}}/mlruns'
  mlflow_experiment_name: CVEvolve
# Hutch tracking — CVEvolve's own lightweight daemon + SQLite DB. Toggled from
# the "Enable Hutch tracking" checkbox in the Use CVEvolve dialog, which also
# drives the live [SQL table] [model output] view. db_path lives under the
# gitignored hutch/ dir.
hutch:
  enabled: false
  project: cvevolve
  run_id: null
  daemon_url: null
  db_path: '{{ROOT}}/hutch/{{NAME}}.db'
  strict: false
